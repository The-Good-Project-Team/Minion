    in the IL2RA region in type 1 diabetes: Genome-wide association studies are now identifying disease-associated
    chromosome regions. However, even after convincing replication, the localization of the causal variant(s)
    requires comprehensive resequencing, extens | Type 1 diabetes-associated IL2RA variation lowers IL-2
    signaling and contributes to diminished CD4+CD25+ regulatory T cell function.: Numerous reports have
    demonstrated that CD4(+)CD25(+) regulatory T cells (Tregs) from individuals with a range of human
    autoimmune diseases, including type 1 diabetes, are deficient in their ability to control autologous'
